[project]
name = "cyrblu-reconnaissance"
version = "0.1.0"
description = "Independent authorized reconnaissance and attack-surface intelligence engine"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.30,<1", "cryptography>=42", "PyYAML>=6,<7"]

[project.scripts]
recon-engine = "cyrblu_recon.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cyrblu_recon", "cyrblu_recon.config", "cyrblu_recon.schemas",
  "cyrblu_recon.database", "cyrblu_recon.orchestrator", "cyrblu_recon.agents",
  "cyrblu_recon.skills", "cyrblu_recon.tools", "cyrblu_recon.evidence",
  "cyrblu_recon.intelligence", "cyrblu_recon.attack_surface_graph",
  "cyrblu_recon.reporting"]
package-dir = {cyrblu_recon = "."}

[tool.setuptools.package-data]
cyrblu_recon = ["skills/*/skill.json", "reporting/static/*", "database/migrations/*.sql", "config/discovery-rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
