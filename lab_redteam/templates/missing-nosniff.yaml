id: lab-missing-nosniff
info:
  name: Lab HTML response missing nosniff
  author: lab-redteam
  severity: low
  description: Observe a missing hardening header on a successful HTML HEAD response.
requests:
  - method: HEAD
    path:
      - "{{BaseURL}}/"
    redirects: false
    max-size: 8192
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "text/html"
        case-insensitive: true
      - type: word
        part: header
        words:
          - "x-content-type-options:"
        case-insensitive: true
        negative: true
