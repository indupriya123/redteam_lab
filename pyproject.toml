[project]
name = "lab-redteam"
version = "0.1.0"
description = "Allowlisted lab assessment, synthetic demonstrations, and evidence reporting"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
lab-redteam = "lab_redteam.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["lab_redteam*"]

[tool.setuptools.package-data]
lab_redteam = ["static/*", "templates/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
